<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путингейт. Скоро</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-rose-600 selection:text-white">
    <!-- Header / Hero Section -->
    <header class="w-full px-6 py-12 md:py-20 flex flex-col items-center justify-center text-center">
        <div class="max-w-3xl mx-auto space-y-6">
            <span class="inline-block py-1 px-4 rounded-full bg-rose-950/60 border border-rose-800 text-rose-400 text-xs md:text-sm font-semibold tracking-widest uppercase animate-pulse">
                Расследование
            </span>
            <h1 class="text-4xl sm:text-6xl md:text-7xl font-bold tracking-tight text-white drop-shadow-sm">
                Путингейт. <span class="text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-red-600">Скоро</span>
            </h1>
            <div class="w-24 h-1 bg-rose-600 mx-auto rounded-full"></div>
        </div>
    </header>

    <!-- Main Content / Questions Section -->
    <main class="w-full max-w-2xl mx-auto px-6 py-8 flex-grow">
        <div class="space-y-4">
            <div class="p-6 rounded-2xl bg-slate-900/80 border border-slate-800 shadow-xl transition-all duration-300 hover:border-slate-700 hover:bg-slate-900">
                <p class="text-lg md:text-xl font-medium text-slate-200">
                    Сколько у Путина детей?
                </p>
            </div>

            <div class="p-6 rounded-2xl bg-slate-900/80 border border-slate-800 shadow-xl transition-all duration-300 hover:border-slate-700 hover:bg-slate-900">
                <p class="text-lg md:text-xl font-medium text-slate-200">
                    Есть ли у президента любовницы?
                </p>
            </div>

            <div class="p-6 rounded-2xl bg-slate-900/80 border border-slate-800 shadow-xl transition-all duration-300 hover:border-slate-700 hover:bg-slate-900">
                <p class="text-lg md:text-xl font-medium text-slate-200">
                    Почему Людмила Путина бросила мужа?
                </p>
            </div>

            <div class="p-6 rounded-2xl bg-slate-900/80 border border-slate-800 shadow-xl transition-all duration-300 hover:border-slate-700 hover:bg-slate-900">
                <p class="text-lg md:text-xl font-medium text-slate-200">
                    Как получают должности любимчики президента?
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-8 text-center text-slate-600 text-xs md:text-sm tracking-wider uppercase border-t border-slate-900 mt-12">
        <p>Следите за обновлениями</p>
    </footer>
</body>
</html>
